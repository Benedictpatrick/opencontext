name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # The kernel writes SQLite and session files by path, and the TUI is
          # rendered by a terminal emulator, so Windows is worth one real run
          # rather than assuming POSIX behaviour carries over.
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Benchmark reproduces the published figures
        # test_benchmark_fixtures.py already asserts this, but running the
        # command proves the CLI path works on a clean machine, and prints the
        # table into the log where a drift is visible without reading a diff.
        run: python -m opencontext.cli bench --markdown

      - name: Installed console script works
        run: |
          opencontext --version
          opencontext doctor
