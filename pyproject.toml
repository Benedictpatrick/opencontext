[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencontext"
version = "0.3.0"
description = "A virtual memory kernel for LLM context windows: token budgets, disk-backed swap and traceback compaction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenContext" }]
keywords = ["llm", "agents", "context", "context-window", "mcp", "tokens", "openai-proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The kernel itself needs only pydantic. Everything else belongs to an interface,
# so a library or MCP-only install does not drag in a web framework.
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
tui = ["textual>=0.80.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
exact-tokens = ["tiktoken>=0.5.0"]
all = [
    "textual>=0.80.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "tiktoken>=0.5.0",
]
dev = [
    "textual>=0.80.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "tiktoken>=0.5.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/your-org/opencontext"
Issues = "https://github.com/your-org/opencontext/issues"

[project.scripts]
opencontext = "opencontext.cli:main"

[tool.setuptools.packages.find]
include = ["opencontext*"]

[tool.setuptools.package-data]
opencontext = ["interfaces/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
# Pinned explicitly: leaving it unset emits a deprecation warning on every run.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:textual.*",
]
addopts = "-q"
